<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}Northwood High School Anime Club{% endblock %}">
    <meta name="theme-color" content="#050714">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Northwood Anime Club">
    <meta property="og:title" content="{% block og_title %}{% block title %}Northwood Anime Club{% endblock %}{% endblock %}">
    <meta property="og:description" content="Northwood High School Anime Club in Irvine, California">
    <meta property="og:image" content="https://nac.moe/media/lovebulletjoinanimeclub.png">
    <link rel="preload" href="/media/titan-one.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/media/titillium-web-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/media/Odin-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/media/TightSpotBB-BoldItalic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/media/site.css?v=20260805">
    <title>{{ self.title() }}</title>
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="sky-backdrop" aria-hidden="true"></div>
    {% include 'header.html' %}
    <main id="main-content" class="site-main {% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
    {% include 'footer.html' %}
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
